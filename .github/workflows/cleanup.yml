name: Cleanup Branch Documentation

on:
  delete:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gitActions branch
        uses: actions/checkout@v4
        with:
          ref: gitActions

      - name: Remove branch directory
        run: |
          BRANCH_NAME="${{ github.event.ref }}"
          rm -rf "gitBranches/$BRANCH_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Cleanup documentation for deleted branch: $BRANCH_NAME" || echo "Nothing to cleanup"
          git push origin gitActions || echo "Nothing to push"
